# Sync server (server/): tests and image build on every push, deploy to
# Cloud Run from main once the project is set up (docs/operations.md).
name: Server

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notedown_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/notedown_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker build -t notedown-server .

  deploy:
    needs: test
    # Skipped until the repository variables from docs/operations.md exist.
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy-server
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/notedown/server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # A placeholder or a URL instead of a host name breaks the deployed app.
      - run: scripts/check-host.sh WEB_HOST
        env:
          WEB_HOST: ${{ vars.WEB_HOST }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: notedown-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" server && docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy notedown-api
          --image "$IMAGE" --region "$REGION"
          --service-account "notedown-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          --allow-unauthenticated --max-instances 2 --memory 512Mi
          --set-secrets "DATABASE_URL=notedown-database-url:latest,SERVER_SECRET=notedown-server-secret:latest"
          --set-env-vars "^|^CORS_ORIGINS=https://localhost,https://${{ vars.WEB_HOST }}"
      - name: Health check
        run: |
          url=$(gcloud run services describe notedown-api --region "$REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health"
