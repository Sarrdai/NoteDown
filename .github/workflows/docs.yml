# Every doc over 100 lines carries an up-to-date table of contents
# (CLAUDE.md → "Run node scripts/doc-toc.js after changing any Markdown file").
name: Docs

on:
  push:
    branches: ["claude/**"]
    paths: ["**/*.md", "scripts/doc-toc.js"]
  pull_request:
    branches: [main]
    paths: ["**/*.md", "scripts/doc-toc.js"]
  workflow_dispatch:

jobs:
  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - run: node scripts/doc-toc.js --check
