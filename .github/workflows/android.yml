# Android app (mobile/ wraps app/): builds an APK on every push; from main,
# signed with the release key, it replaces the "android-test" pre-release
# (docs/operations.md). Other branches build "NoteDown Preview", an app of its
# own that installs beside the test app (build.gradle → buildTypes.preview).
#
# The release key is a secret of the environment `release`, which only main may use
# (deployment branch rule). A branch build must never reach it: any run can read every
# secret it can reach, whatever its workflow file says. Branch builds sign with their
# own preview key (ANDROID_PREVIEW_KEYSTORE_*), else with the debug key
# (docs/operations.md → "5. Android signing key").
name: Android

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["app/**", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # main runs in `release`, which holds the release key; every other ref runs in `preview`.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || 'preview' }}
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Only whether a key is set is looked at here, never its value. On main HAS_RELEASE_KEY says the
      # release key is there; on a branch it says the key is still readable by branch builds (warning below).
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PREVIEW_KEY: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 != '' }}
      WEB_HOST: ${{ vars.WEB_HOST }}   # the host of the App Link for invitation links (AndroidManifest.xml)
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A branch build can read the release key while it is still a repository secret. It never uses it.
      - name: Warn that branch builds can read the release key
        if: github.ref != 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "::warning::The release signing key (ANDROID_KEYSTORE_BASE64) is still readable by branch builds. This build does not use it. Move it into the environment 'release' and delete the repository secrets (docs/operations.md, section 5)."
      # A placeholder or a URL instead of a host name breaks the deployed app.
      - run: ../scripts/check-host.sh API_HOST WEB_HOST
        env:
          API_HOST: ${{ vars.API_HOST }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # The app finds its sync server, the web address that invitation links start with, the
      # operator named in the privacy policy and terms of use, and its version in app/config.json
      # (empty in the repository). The version starts with the APK's versionName (app/build.gradle).
      - run: APP_VERSION="0.1.$VERSION_CODE · $(date -u +%F) · ${GITHUB_SHA::7}" node ../scripts/write-config.js
        env:
          API_HOST: ${{ vars.API_HOST }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
      - run: npx cap sync android

      # Signed with the preview key, else with the debug key (new in every run, so these previews don't
      # install over each other). build.gradle reads the key from the same variables as the release key.
      - name: Build preview APK (branches other than main)
        if: github.ref != 'refs/heads/main'
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: notedown
        run: |
          if [ "$HAS_PREVIEW_KEY" = true ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/preview.jks"
            echo "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          fi
          (cd android && ./gradlew --no-daemon assemblePreview)
          cp android/app/build/outputs/apk/preview/app-preview.apk "$RUNNER_TEMP/notedown.apk"

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: notedown
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          (cd android && ./gradlew --no-daemon assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/notedown.apk"

      - name: Build debug APK (no release key yet)
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY != 'true'
        run: |
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/notedown.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notedown-apk
          path: ${{ runner.temp }}/notedown.apk

      - name: Publish the android-test pre-release
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --cleanup-tag --yes || true
          gh release create android-test "$RUNNER_TEMP/notedown.apk" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Android test build ${VERSION_CODE}" \
            --notes "Test build from ${GITHUB_SHA::7}. Install: docs/operations.md → \"Installing the test app\"."
