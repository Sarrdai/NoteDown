<!doctype html>
<html lang="en" data-flavor="latte">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>NoteDown</title>
  <link rel="stylesheet" href="css/catppuccin.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app" data-view="open">
    <aside class="toc-panel" id="tocPanel" aria-label="Contents">
      <div class="toc-handle" aria-hidden="true"></div>
      <div class="toc-head">
        <span class="toc-title">Contents</span>
        <div class="panel-tabs" id="panelTabs" role="tablist" aria-label="Sidebar">
          <button class="panel-tab" role="tab" data-tab="toc" aria-selected="true">Contents</button>
          <button class="panel-tab" role="tab" data-tab="people" aria-selected="false">People</button>
        </div>
        <div class="stepper" role="group" aria-label="Heading levels">
          <button class="icon-btn small" id="tocLess" aria-label="Fewer levels"></button>
          <span class="stepper-value" id="tocDepth">2</span>
          <button class="icon-btn small" id="tocMore" aria-label="More levels"></button>
        </div>
      </div>
      <nav class="toc-list" id="tocList"></nav>
      <section class="people-pane" id="peoplePane" aria-label="People">
        <div class="people-head"><span class="toc-title">People</span></div>
        <nav class="people-list" id="peopleList"></nav>
      </section>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="tocBtn" aria-label="Contents"></button>
        <h1 class="title" id="title">Notes</h1>
        <label class="search" id="search">
          <span class="search-icon" id="searchIcon"></span>
          <input type="search" id="searchInput" placeholder="Search" autocomplete="off">
          <button class="icon-btn small" id="searchClose" aria-label="Close search"></button>
        </label>
        <button class="icon-btn" id="peopleBtn" aria-label="People"></button>
        <button class="icon-btn" id="searchBtn" aria-label="Search"></button>
        <button class="icon-btn labelled" id="sortBtn" aria-haspopup="menu"><span class="btn-icon"></span><span class="btn-label" id="sortLabel"></span></button>
        <button class="icon-btn labelled" id="viewBtn">
          <span class="view-face to-archive"><span class="btn-icon"></span><span class="btn-label">Archive</span><span class="count" id="archiveCount">0</span></span>
          <span class="view-face to-notes"><span class="btn-icon"></span><span class="btn-label">Notes</span></span>
        </button>
        <button class="icon-btn" id="syncBtn" hidden></button>
        <button class="icon-btn" id="moreBtn" aria-haspopup="menu" aria-label="More"></button>
      </header>
      <div class="selectbar keep-editing" id="selectBar" role="toolbar" aria-label="Selection" hidden>
        <button class="icon-btn" id="selCancel" aria-label="Cancel selection"></button>
        <button class="icon-btn" id="selToc" aria-label="Contents"></button>
        <span class="sel-count" id="selCount" aria-live="polite"></span>
        <div class="sel-actions" id="selActions"></div>
        <button class="icon-btn" id="selMore" aria-haspopup="menu" aria-label="More actions"></button>
      </div>
      <div class="filter-bar" id="filterBar" hidden>
        <span class="filter-chip" id="filterChip"><span id="filterChipLabel"></span><button class="icon-btn small" id="filterClear" aria-label="Show all notes"></button></span>
      </div>
      <div class="pull-indicator" id="pullIndicator" aria-hidden="true"></div>
      <div class="list" id="list"></div>
      <p class="empty" id="empty" hidden></p>
    </main>

    <button class="fab keep-editing" id="fab" aria-label="New note (hold to dictate)"></button>
    <div class="recorder keep-editing" id="recorder" hidden>
      <div class="rec-preview" id="recPreview" aria-live="polite"></div>
      <div class="rec-bar">
        <button class="icon-btn rec-trash" id="recTrash" aria-label="Cancel dictation"></button>
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="rec-time" id="recTime">0:00</span>
        <span class="rec-level" id="recLevel" aria-hidden="true"></span>
        <span class="rec-hint" id="recHint">‹ Slide to cancel</span>
      </div>
      <div class="rec-lock" id="recLock" aria-hidden="true"><span id="recLockIcon"></span></div>
    </div>
    <div class="toolbar keep-editing" id="toolbar" role="toolbar" aria-label="Formatting" hidden>
      <div class="toolbar-scroll" id="toolbarButtons"></div>
      <button class="toolbar-done" id="toolbarDone">Done</button>
    </div>
    <input type="date" id="dueInput" class="visually-hidden keep-editing" tabindex="-1" aria-hidden="true">
    <div class="snackbar keep-editing" id="snackbar" role="status" hidden>
      <span id="snackText"></span>
      <button id="snackUndo">Undo</button>
    </div>
    <div class="menu keep-editing" id="menu" role="menu" hidden></div>
    <div class="dialog-scrim keep-editing" id="orderDialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
        <h2 class="dialog-title" id="orderTitle"></h2>
        <p class="dialog-hint" id="orderHint">Drag to change the order.</p>
        <ol class="order-list" id="orderList"></ol>
        <div class="merge-choice" id="orderChoice" role="radiogroup" aria-label="Shared notes" hidden></div>
        <div class="dialog-actions">
          <button class="btn" id="orderCancel">Cancel</button>
          <button class="btn primary" id="orderOk"></button>
        </div>
      </div>
    </div>
    <div class="dialog-scrim keep-editing" id="confirmDialog" hidden>
      <div class="dialog confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
        <h2 class="dialog-title" id="confirmTitle"></h2>
        <p class="dialog-hint" id="confirmText"></p>
        <label class="confirm-check" id="confirmCheckRow" hidden>
          <input type="checkbox" id="confirmCheck">
          <span id="confirmCheckLabel"></span>
        </label>
        <p class="confirm-warning" id="confirmWarning" hidden></p>
        <div class="dialog-actions">
          <button class="btn" id="confirmCancel">Cancel</button>
          <button class="btn primary danger" id="confirmOk"></button>
        </div>
      </div>
    </div>
    <div class="dialog-scrim keep-editing" id="syncPanel" hidden>
      <div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
        <header class="sheet-head">
          <button class="icon-btn" id="syncBack" aria-label="Close"></button>
          <h2 class="sheet-title" id="syncTitle" tabindex="-1"></h2>
        </header>
        <div class="sheet-body" id="syncBody"></div>
        <div class="sheet-foot" id="syncFoot" hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
