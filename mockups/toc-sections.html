<style>
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8; --surface0: #ccd0da; --surface1: #bcc0cc;
  --overlay1: #8c8fa1; --subtext0: #6c6f85; --text: #4c4f69; --mauve: #8839ef; --red: #d20f39; --blue: #1e66f5;
  --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b; --surface0: #313244; --surface1: #45475a;
    --overlay1: #7f849c; --subtext0: #a6adc8; --text: #cdd6f4; --mauve: #cba6f7; --red: #f38ba8; --blue: #89b4fa;
    --on-accent: #1e1e2e;
  }
}
:root {
  --bg: var(--mantle); --surface: var(--base); --border: var(--surface0); --hover: var(--surface0);
  --muted: var(--subtext0); --faint: var(--overlay1); --accent: var(--mauve);
  --accent-soft: color-mix(in srgb, var(--mauve) 16%, transparent);
  --accent-bar: color-mix(in srgb, var(--mauve) 14%, var(--bg));
  --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 2px 8px rgb(0 0 0 / 0.05);
  --shadow-high: 0 4px 12px rgb(0 0 0 / 0.18), 0 12px 32px rgb(0 0 0 / 0.16);
  --toc-w: 280px; --topbar-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.icon-btn.small { width: 32px; height: 32px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.small svg { width: 18px; height: 18px; }
.label-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.label-btn:hover { background: var(--hover); }
.label-btn svg { width: 18px; height: 18px; }
.label-btn.primary { background: var(--accent); color: var(--on-accent); }

/* Top bar (normal and contextual) */
.topbar { position: sticky; top: 0; z-index: 10; height: var(--topbar-h); display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
.topbar .title { font-weight: 700; font-size: 1.15rem; flex: 1; }
.topbar.ctx { z-index: 25; padding-left: 4px; background: var(--accent-bar); }  /* above the sheet's scrim */
.topbar.ctx .title { font-weight: 600; font-size: 1rem; }
#tocBtn { display: none; }

/* Table of contents */
.toc { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: var(--toc-w); display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--border); }
.toc-handle { display: none; }
.toc-head { height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); }
.toc-head .t { flex: 1; font-weight: 650; }
.toc-head.ctx { padding-left: 4px; background: var(--accent-bar); }
.toc-head.ctx .t { font-weight: 600; font-size: 0.95rem; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper span { min-width: 18px; text-align: center; font-weight: 600; color: var(--muted); }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 8px 24px; }
.toc-entry { position: relative; display: block; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.toc-entry:hover { background: var(--hover); }
.toc-entry.l1 { font-weight: 600; margin-top: 4px; }
.toc-entry.l2 { padding-left: 24px; color: var(--muted); }
.toc-entry.l3 { padding-left: 38px; color: var(--muted); font-size: 0.88rem; }
.toc-entry.l4, .toc-entry.l5 { padding-left: 52px; color: var(--faint); font-size: 0.86rem; }
.toc-entry.plain { font-style: italic; font-weight: 500; }
/* A note without a heading hangs under the section above it: a thin guide line. */
.toc-entry.plain:not(.l1)::before { content: ""; position: absolute; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--surface1); }
.toc-entry.plain.l2::before { left: 14px; } .toc-entry.plain.l3::before { left: 28px; } .toc-entry.plain.l4::before, .toc-entry.plain.l5::before { left: 42px; }
.toc-entry.sel { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.toc-entry.sel.plain::before { background: var(--accent); }
.toc-entry .more { margin-left: 6px; font-size: 0.75rem; font-style: normal; color: var(--accent); font-weight: 600; }
.toc-entry.pressing { background: var(--hover); }

.main { margin-left: var(--toc-w); min-height: 100%; }
.list { max-width: 780px; margin: 0 auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 12px; }
.note { position: relative; display: flex; gap: 10px; padding: 14px 16px 12px 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.note.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }
.round { width: 22px; height: 22px; margin: 2px 0 0; border: 2px solid var(--surface1); border-radius: 999px; flex: none; }
.body { flex: 1; min-width: 0; }
.seg { margin: 0 -8px; padding: 0 8px; border-radius: 8px; }
.seg.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.body h2, .body h3, .body h4 { margin: 0.35em 0 0.2em; line-height: 1.25; }
.body h2 { font-size: 1.2rem; } .body h3 { font-size: 1.05rem; } .body h4 { font-size: 0.95rem; color: var(--muted); }
.body p { margin: 0.25em 0; }
.body ul, .body ol { margin: 0.25em 0; padding-left: 1.4em; }
.body li.task { list-style: none; margin-left: -1.3em; }
.body li.task input { margin: 0 6px 0 0; accent-color: var(--accent); }
.body code { padding: 1px 5px; border-radius: 6px; background: var(--surface0); font-size: 0.88em; }

.meta { margin-top: 6px; font-size: 0.8rem; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); font-weight: 600; }
.chip.new { background: var(--accent-soft); color: var(--accent); }

.snackbar { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translateX(-50%); display: none; align-items: center; gap: 16px; padding: 10px 10px 10px 18px; border-radius: 12px; background: var(--text); color: var(--base); box-shadow: var(--shadow-high); font-size: 0.95rem; white-space: nowrap; }
.snackbar.show { display: flex; }
.snackbar button { border: 0; background: transparent; color: var(--base); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 6px 10px; }

/* Mockup switcher */
.shot .mock-btn { display: none; }
.mock-btn { position: fixed; z-index: 50; right: 12px; bottom: 12px; }
.mock-btn > button { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.mock-panel { position: absolute; right: 0; bottom: 52px; width: 270px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-high); font-size: 0.9rem; display: none; }
.mock-panel.open { display: block; }
.mock-panel h4 { margin: 4px 0 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--faint); }
.mock-panel label { display: block; padding: 3px 0; }
.mock-panel .rec { color: var(--accent); font-size: 0.8rem; }

@media (max-width: 1023px) { :root { --toc-w: 248px; } }
@media (max-width: 599px) {
  .main { margin-left: 0; }
  #tocBtn { display: grid; }
  .scrim { position: fixed; inset: 0; z-index: 15; background: rgb(0 0 0 / 0.32); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .toc-open .scrim { opacity: 1; pointer-events: auto; }
  .toc { top: auto; right: 0; width: auto; height: 62vh; border-right: 0; border-radius: 18px 18px 0 0; background: var(--surface); box-shadow: var(--shadow-high); transform: translateY(105%); transition: transform 0.22s ease-out; }
  .toc-open .toc { transform: none; }
  .toc-handle { display: block; width: 40px; height: 5px; margin: 8px auto 0; border-radius: 999px; background: var(--surface1); flex: none; }
  .toc-head { height: 48px; border-bottom: 0; }
  .toc-head.ctx { margin: 0 8px; border-radius: 12px; }
  .toc-entry { min-height: 44px; }
  .icon-btn:hover, .toc-entry:hover, .label-btn:hover { background: transparent; }
  .toc-entry.sel:hover { background: var(--accent-soft); }
  .label-btn .txt { display: none; }
  .label-btn { padding: 0 10px; }
  .snackbar { bottom: 16px; }
  .mock-btn { bottom: auto; top: 6px; right: 112px; }
  .mock-btn > button { border: 0; box-shadow: none; background: transparent; }
  .mock-panel { bottom: auto; top: 48px; right: -100px; }
}
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
const ICON = {
  contents: '<path d="M4 6h16M4 12h10M4 18h13"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  minus: '<path d="M5 12h14"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  move: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M12 11l3 3-3 3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
};
const icon = name => `<svg viewBox="0 0 24 24">${ICON[name]}</svg>`;
const params = new URLSearchParams(location.search);
const opts = { bar: params.get("bar") || "toc", levels: params.get("levels") || "align" };
const phone = matchMedia("(max-width: 599px)");
if (params.has("shot")) document.documentElement.classList.add("shot");  // screenshots: hide the switcher

// ---- Notes ---------------------------------------------------------------
function parseSample() {
  const text = $("sample").textContent;
  const out = [];
  for (const part of text.split(/^(?=<!-- note )/m)) {
    const m = /^<!-- note (.*?) -->\n([\s\S]*)$/.exec(part.trim());
    if (!m) continue;
    const meta = Object.fromEntries(m[1].split(" ").map(kv => kv.split("=")));
    out.push({ id: meta.id, created: meta.created, modified: meta.modified, due: meta.due || null, body: m[2].trim() });
  }
  return out;
}
let notes = parseSample();
let undoStack = null;

// ---- Table of contents with note breaks ----------------------------------
// Every heading is an entry; a note that doesn't start with a heading gets an
// entry with its first sentence, one level below the last heading above it
// (across notes, in view order). Each entry owns the lines from its own line
// up to the next entry of any level, so a note boundary always ends a section.
function headingOf(line) {
  const m = /^(#{1,6})\s+(.*)$/.exec(line);
  return m ? { depth: m[1].length, text: m[2].trim() } : null;
}
function firstSentence(body, max = 60) {
  const t = body.replace(/[#*_`>\[\]]|\(http[^)]*\)/g, "").replace(/\s+/g, " ").trim();
  const m = /^(.+?[.!?])(\s|$)/.exec(t);
  const s = m ? m[1] : t;
  return s.length > max ? s.slice(0, max - 1).trimEnd() + "…" : s;
}
function buildToc() {
  const depths = notes.flatMap(n => n.body.split("\n").map(headingOf).filter(Boolean).map(h => h.depth));
  const top = depths.length ? Math.min(...depths) : 1;
  const entries = [];
  let lastHeadingLevel = 0;
  for (const n of notes) {
    const lines = n.body.split("\n");
    const starts = [];
    if (!headingOf(lines[0])) {
      const lvl = lastHeadingLevel + 1;
      starts.push({ line: 0, level: lvl, text: firstSentence(n.body), plain: true });
    }
    lines.forEach((l, i) => {
      const h = headingOf(l);
      if (!h) return;
      lastHeadingLevel = h.depth - top + 1;
      starts.push({ line: i, level: lastHeadingLevel, text: h.text, plain: false, depth: h.depth });
    });
    starts.forEach((s, k) => entries.push({
      id: `${n.id}-${k}`, noteId: n.id, ...s, start: s.line,
      end: k + 1 < starts.length ? starts[k + 1].line : lines.length,
    }));
  }
  const maxLevel = entries.reduce((m, e) => Math.max(m, e.level), 1);
  return { entries, maxLevel };
}
/** Entries below `e` in the overall structure (any note), until the next entry at its level or above. */
function subtree(entries, e) {
  const out = [];
  for (let i = entries.indexOf(e) + 1; i < entries.length && entries[i].level > e.level; i++) out.push(entries[i]);
  return out;
}

// ---- State ---------------------------------------------------------------
let toc = buildToc();
let depth = 2;
let selected = new Set();   // entry ids
let selecting = false;
let anchor = null;

function setSelection(ids) {
  selected = new Set(ids);
  selecting = selected.size > 0;
  render();
}
function toggleEntry(e) {
  const group = [e, ...subtree(toc.entries, e)];
  const on = !selected.has(e.id);
  group.forEach(x => on ? selected.add(x.id) : selected.delete(x.id));
  anchor = e;
  setSelection([...selected]);
}
function rangeTo(e) {
  const shown = toc.entries.filter(x => x.level <= depth);
  const a = shown.indexOf(anchor || e), b = shown.indexOf(e);
  shown.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => [x, ...subtree(toc.entries, x)].forEach(y => selected.add(y.id)));
  setSelection([...selected]);
}
function endSelection() { anchor = null; setSelection([]); }

// ---- Move / Copy ---------------------------------------------------------
/** Selected text as blocks: runs of selected entries that are adjacent within one note. */
function selectionBlocks() {
  const blocks = [];
  for (const e of toc.entries) {
    if (!selected.has(e.id)) continue;
    const last = blocks[blocks.length - 1];
    if (last && last.noteId === e.noteId && last.end === e.start) last.end = e.end;
    else blocks.push({ noteId: e.noteId, start: e.start, end: e.end });
  }
  for (const b of blocks) {
    const lines = notes.find(n => n.id === b.noteId).body.split("\n").slice(b.start, b.end);
    const ds = lines.map(headingOf).filter(Boolean).map(h => h.depth);
    b.lines = lines;
    b.minDepth = ds.length ? Math.min(...ds) : null;
  }
  return blocks;
}
function blocksText(blocks, align) {
  const depths = blocks.map(b => b.minDepth).filter(d => d !== null);
  const target = Math.min(2, ...depths);
  return blocks.map(b => {
    const shift = align && b.minDepth !== null ? target - b.minDepth : 0;
    return b.lines.map(l => {
      const h = /^(#{1,6})(\s.*)$/.exec(l);
      return h && shift ? "#".repeat(Math.max(1, h[1].length + shift)) + h[2] : l;
    }).join("\n").trim();
  }).join("\n\n");
}
function copySelection() {
  const text = blocksText(selectionBlocks(), false);
  navigator.clipboard?.writeText(text).catch(() => {});
  snack("Copied to clipboard", false);
}
function moveSelection() {
  const blocks = selectionBlocks();
  if (!blocks.length) return;
  undoStack = notes.map(n => ({ ...n }));
  const body = blocksText(blocks, opts.levels === "align");
  const involved = new Set(blocks.map(b => b.noteId));
  const created = notes.filter(n => involved.has(n.id)).map(n => n.created).sort()[0];
  const now = new Date().toISOString().slice(0, 16) + "Z";
  const remaining = [];
  for (const n of notes) {
    if (!involved.has(n.id)) { remaining.push(n); continue; }
    const lines = n.body.split("\n");
    const drop = new Set();
    blocks.filter(b => b.noteId === n.id).forEach(b => { for (let i = b.start; i < b.end; i++) drop.add(i); });
    const rest = lines.filter((_, i) => !drop.has(i)).join("\n").replace(/\n{3,}/g, "\n\n").trim();
    if (rest) remaining.push({ ...n, body: rest, modified: now });   // an emptied note disappears
  }
  const fresh = { id: "n" + Date.now(), created, modified: now, due: null, body, isNew: true };
  notes = [fresh, ...remaining];
  toc = buildToc();
  selected = new Set(); selecting = false; anchor = null;
  if (phone.matches) $("app").classList.remove("toc-open");
  render();
  scrollTo({ top: 0, behavior: "smooth" });
  flash(fresh.id);
  snack("Moved to new note", true);
}
function undo() {
  if (!undoStack) return;
  notes = undoStack; undoStack = null; toc = buildToc();
  render(); hideSnack();
}
let snackTimer;
function snack(text, withUndo) {
  $("snackText").textContent = text;
  $("snackUndo").style.display = withUndo ? "" : "none";
  $("snack").classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, 5000);
}
function hideSnack() { $("snack").classList.remove("show"); }
function flash(id) {
  const el = document.querySelector(`.note[data-id="${id}"]`);
  if (!el) return;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

// ---- Rendering -----------------------------------------------------------
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(lines) {
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const l of lines) {
    const h = headingOf(l), task = /^[-*]\s+\[([ xX])\]\s+(.*)$/.exec(l), ul = /^[-*]\s+(.*)$/.exec(l), ol = /^\d+[.)]\s+(.*)$/.exec(l);
    if (h) { close(); html += `<h${Math.min(h.depth, 6)}>${inline(h.text)}</h${Math.min(h.depth, 6)}>`; }
    else if (task || ul) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += task ? `<li class="task"><input type="checkbox"${task[1] !== " " ? " checked" : ""}>${inline(task[2])}</li>` : `<li>${inline(ul[1])}</li>`;
    } else if (ol) {
      if (list !== "ol") { close(); html += "<ol>"; list = "ol"; }
      html += `<li>${inline(ol[1])}</li>`;
    } else if (l.trim()) { close(); html += `<p>${inline(l)}</p>`; }
    else close();
  }
  close();
  return html;
}
function shortDate(iso) {
  return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
function renderList() {
  $("list").innerHTML = notes.map(n => {
    const lines = n.body.split("\n");
    const segs = toc.entries.filter(e => e.noteId === n.id)
      .map(e => `<div class="seg${selected.has(e.id) ? " sel" : ""}">${md(lines.slice(e.start, e.end))}</div>`).join("");
    const meta = n.isNew
      ? `<span class="chip new">New</span><span>Created ${shortDate(n.created)} · from the oldest part</span>`
      : `<span>Edited ${shortDate(n.modified)}</span>${n.due ? `<span class="chip">Due ${shortDate(n.due)}</span>` : ""}`;
    return `<article class="note" data-id="${n.id}"><div class="round"></div><div class="body">${segs}<div class="meta">${meta}</div></div></article>`;
  }).join("");
}
function actionsHtml(compact) {
  // In the narrow contents header the actions are icons only (title = label).
  const txt = t => compact ? "" : `<span class="txt">${t}</span>`;
  return `<button class="label-btn" data-act="copy" aria-label="Copy" title="Copy">${icon("copy")}${txt("Copy")}</button>
    <button class="label-btn primary" data-act="move" aria-label="Move to new note" title="Move to new note">${icon("move")}${txt("Move to new note")}</button>`;
}
function countLabel() {
  // Counts the visible entries; selected deeper levels show as "+n" on their parent.
  return `${toc.entries.filter(e => e.level <= Math.min(depth, toc.maxLevel) && selected.has(e.id)).length} selected`;
}
function renderBars() {
  const ctxInToc = selecting && opts.bar === "toc";
  const ctxInTop = selecting && opts.bar === "top";
  const d = Math.min(depth, toc.maxLevel);
  $("tocHead").className = "toc-head" + (ctxInToc ? " ctx" : "");
  $("tocHead").innerHTML = ctxInToc
    ? `<button class="icon-btn" data-act="end" aria-label="End selection">${icon("close")}</button><span class="t">${countLabel()}</span>${actionsHtml(true)}`
    : `<span class="t">Contents</span><div class="stepper">
        <button class="icon-btn small" data-act="less" ${d <= 1 ? "disabled" : ""} aria-label="Fewer levels">${icon("minus")}</button>
        <span>${d}</span>
        <button class="icon-btn small" data-act="more" ${d >= toc.maxLevel ? "disabled" : ""} aria-label="More levels">${icon("plus")}</button></div>`;
  $("topbar").className = "topbar" + (ctxInTop ? " ctx" : "");
  $("topbar").innerHTML = ctxInTop
    ? `<button class="icon-btn" data-act="end" aria-label="End selection">${icon("close")}</button><span class="title">${countLabel()}</span>${actionsHtml(false)}`
    : `<button class="icon-btn" id="tocBtn" data-act="toc" aria-label="Contents">${icon("contents")}</button><span class="title">Notes</span>
       <button class="icon-btn" aria-label="Search">${icon("search")}</button>`;
}
function renderToc() {
  const d = Math.min(depth, toc.maxLevel);
  $("tocList").replaceChildren(...toc.entries.filter(e => e.level <= d).map(e => {
    const b = document.createElement("button");
    b.className = `toc-entry l${e.level}` + (e.plain ? " plain" : "") + (selected.has(e.id) ? " sel" : "");
    b.textContent = e.text;
    const hiddenSel = subtree(toc.entries, e).filter(x => x.level > d && selected.has(x.id)).length;
    const hiddenAll = subtree(toc.entries, e).filter(x => x.level > d).length;
    if (selecting && hiddenAll && selected.has(e.id) && hiddenSel === hiddenAll) {
      const s = document.createElement("span"); s.className = "more"; s.textContent = `+${hiddenAll}`; b.append(s);
    }
    bindEntry(b, e);
    return b;
  }));
}
function render() { renderBars(); renderToc(); renderList(); }

// ---- Input: long-press starts selection, then taps toggle ------------------
function bindEntry(el, e) {
  let timer = null, startY = 0, fired = false;
  el.addEventListener("pointerdown", ev => {
    if (ev.button !== 0) return;
    fired = false; startY = ev.clientY;
    el.classList.add("pressing");
    timer = setTimeout(() => {
      fired = true; el.classList.remove("pressing");
      navigator.vibrate?.(20);
      if (!selecting) { anchor = e; toggleEntry(e); }
    }, 450);
  });
  const cancel = () => { clearTimeout(timer); el.classList.remove("pressing"); };
  el.addEventListener("pointermove", ev => { if (Math.abs(ev.clientY - startY) > 8) cancel(); });
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("contextmenu", ev => ev.preventDefault());
  el.addEventListener("click", ev => {
    if (fired) return;
    if (ev.shiftKey && (selecting || anchor)) return rangeTo(e);
    if (ev.ctrlKey || ev.metaKey || selecting) return toggleEntry(e);
    jump(e);
  });
}
function jump(e) {
  const noteEl = document.querySelector(`.note[data-id="${e.noteId}"]`);
  if (!noteEl) return;
  const seg = noteEl.querySelectorAll(".seg")[toc.entries.filter(x => x.noteId === e.noteId).indexOf(e)] || noteEl;
  if (phone.matches) $("app").classList.remove("toc-open");
  seg.scrollIntoView({ block: "center", behavior: "smooth" });
  flash(e.noteId);
}
document.addEventListener("click", ev => {
  const act = ev.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "end") endSelection();
  if (act === "copy") copySelection();
  if (act === "move") moveSelection();
  if (act === "less") { depth = Math.max(1, Math.min(depth, toc.maxLevel) - 1); render(); }
  if (act === "more") { depth = Math.min(toc.maxLevel, depth + 1); render(); }
  if (act === "toc") $("app").classList.add("toc-open");
});
$("scrim").addEventListener("click", () => { if (!selecting) $("app").classList.remove("toc-open"); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && selecting) endSelection(); });
$("snackUndo").addEventListener("click", undo);

// ---- Mockup switcher ---------------------------------------------------------
$("mockBtn").addEventListener("click", () => $("mockPanel").classList.toggle("open"));
for (const name of ["bar", "levels"]) {
  document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
    r.checked = r.value === opts[name];
    r.addEventListener("change", () => {
      opts[name] = r.value;
      const p = new URLSearchParams(location.search); p.set(name, r.value);
      history.replaceState(null, "", "?" + p);
      render();
    });
  });
}
$("resetBtn").addEventListener("click", () => { notes = parseSample(); toc = buildToc(); undoStack = null; endSelection(); hideSnack(); });

// Hooks for screenshots: mock.select(["s01-0"]), mock.move(), mock.openToc()
window.mock = {
  select(ids) { ids.forEach(id => { const e = toc.entries.find(x => x.id === id); if (e) toggleEntry(e); }); },
  deselect(id) { const e = toc.entries.find(x => x.id === id); if (e && selected.has(e.id)) toggleEntry(e); },
  move: moveSelection, depth(d) { depth = d; render(); },
  openToc() { $("app").classList.add("toc-open"); },
};
render();
document.body.dataset.ready = "1";
</script>
</body>
</html>
